[project]
name = "nomo-rl"
version = "0.0.1"
description = "A framework for reinforcement learning with verifiable rewards."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    'pydantic>=2,<3',
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nomo"

[dependency-groups]
dev = [
    'pytest>=9.2.0',
]
